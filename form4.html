<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <!-- menyematkan video youtube -->
    <!-- ambil kode embed dari tombol share > embed di youtube -->
    <iframe
      width="560"
      height="315"
      src="https://www.youtube.com/embed/VIDEO_ID"
      title="Judul Video"
      feameborder="0"
      allow="
        accelerometer;
        autoplay: clipboard-write;
        encrypted-media;
        gryoscope;"
      allowfullscreen>
    </iframe>

    <!-- menyematkan google maps -->
    <!-- ambil kode embed dari google maps > share > embed a map -->
    <iframe
      src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3960.924275890607!2d112.04780227403519!3d-6.899659867519358!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x2e77a2aa2e02e583%3A0xb530f7140a4b9327!2sSMK%20Taruna%20Jaya%20Prawira!5e0!3m2!1sid!2sid!4v1787702906597!5m2!1sid!2sid"
      width="600"
      height="450"
      style="border: 0"
      allowfullscreen=""
      loading="lazy"
      referrerpolicy="strict-origin-when-cross-origin">
      src="https://www.google.com/maps/embed?pb=KODE_PETA" width="600"
      height="450" style="border:0;" 
      allowfullscreen="" 
      loading="lazy">
      </iframe>

    <!-- iframe biasa ke halaman web lain -->
    <iframe
      src="https://example.com"
      width="800"
      height="400"
      title="halaman contoh"
      frameborder="0">
    </iframe>
  </body>
</html>
